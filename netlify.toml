[build]
  base = ""
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "https://www.krama.digital/*"
  to = "https://krama.digital/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.krama.digital/*"
  to = "https://krama.digital/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
