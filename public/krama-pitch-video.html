<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Krama Pitch Video</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef8f5;
        color: #14312d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 12%, rgba(74, 210, 199, 0.24), transparent 30%),
          radial-gradient(circle at 82% 80%, rgba(255, 174, 102, 0.22), transparent 32%),
          #eef8f5;
      }

      main {
        width: min(96vw, 1180px);
        display: grid;
        gap: 14px;
      }

      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        border-radius: 8px;
        background: #f7fffd;
        box-shadow: 0 28px 80px rgba(20, 49, 45, 0.18);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #28544d;
        font-size: 14px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #18b6a5;
        color: white;
        font-weight: 800;
        padding: 11px 15px;
        cursor: pointer;
      }

      button.secondary {
        background: #25435f;
      }

      .buttons {
        display: flex;
        gap: 8px;
      }

      a {
        color: #0f897e;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="stage" width="1280" height="720" aria-label="Krama animated pitch video"></canvas>
      <div class="controls">
        <span id="status">Preview playing. Duration: 54 seconds.</span>
        <div class="buttons">
          <button id="restart" class="secondary">Restart</button>
          <button id="record">Export WebM</button>
        </div>
      </div>
    </main>

    <script>
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const duration = 54;
      let start = performance.now();
      let recording = false;

      const logo = new Image();
      logo.src = "/krama-logo.png";

      const palette = {
        ink: "#14312d",
        muted: "#5f746f",
        teal: "#21c7b5",
        cyan: "#76d9ee",
        coral: "#ff8e72",
        rose: "#f46fa5",
        amber: "#ffc44f",
        green: "#8ee0b5",
        navy: "#25435f",
        paper: "#f8fffd",
        line: "#d7ebe7",
      };

      const scenes = [
        { start: 0, end: 5, title: "Krama", sub: "Smart digital queue for clinics" },
        { start: 5, end: 13, title: "The clinic problem", sub: "Crowded queues, delayed doctors, billing rush, and missed follow-ups." },
        { start: 13, end: 21, title: "Control Queue", sub: "Live token flow for walk-ins and appointments." },
        { start: 21, end: 29, title: "Time Manager", sub: "Doctor schedules, slots, delays, and live ETA updates." },
        { start: 29, end: 37, title: "Billing Section", sub: "Create bills faster while the patient journey stays connected." },
        { start: 37, end: 45, title: "Reminders & Revisits", sub: "Patients remember appointments. Clinics recover missed revisits." },
        { start: 45, end: 54, title: "One flow. Less waiting.", sub: "Krama helps clinics run calmer, faster, and more predictably." },
      ];

      function ease(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function clamp(v, min = 0, max = 1) {
        return Math.max(min, Math.min(max, v));
      }

      function roundedRect(x, y, w, h, r, fill, stroke, lw = 2) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw;
          ctx.stroke();
        }
      }

      function text(value, x, y, size, weight = 700, color = palette.ink, align = "left") {
        ctx.font = `${weight} ${size}px Inter, Segoe UI, Arial`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "top";
        ctx.fillText(value, x, y);
      }

      function pill(label, x, y, w, color, delay, t) {
        const a = ease(clamp((t - delay) / 0.7));
        const slide = (1 - a) * 70;
        ctx.save();
        ctx.globalAlpha = a;
        roundedRect(x + slide, y, w, 56, 8, color);
        text(label, x + slide + 26, y + 14, 24, 800, "#15302c");
        ctx.restore();
      }

      function drawChrome(x, y, w, h) {
        roundedRect(x, y, w, h, 24, "#21323d");
        roundedRect(x + 34, y + 34, w - 68, h - 68, 8, "#ffffff");
        roundedRect(x + 34, y + 34, w - 68, 58, 8, "#dff8ff");
        ctx.fillStyle = "#eef7f4";
        ctx.fillRect(x + 34, y + 82, w - 68, h - 116);
        if (logo.complete) ctx.drawImage(logo, x + 54, y + 48, 36, 36);
        text("Krama", x + 98, y + 50, 25, 900, palette.ink);
      }

      function drawPhone(x, y, w, h) {
        roundedRect(x, y, w, h, 32, "#26333f");
        roundedRect(x + 16, y + 34, w - 32, h - 68, 20, "#ffffff");
        roundedRect(x + 56, y + 14, w - 112, 8, 8, "#54616d");
      }

      function drawProblems(localT) {
        const items = [
          ["Long waiting room queues", palette.cyan],
          ["Manual token confusion", palette.rose],
          ["Delay calls and angry patients", palette.amber],
          ["Billing and revisit follow-up gaps", palette.green],
        ];
        items.forEach((item, i) => pill(item[0], 332, 210 + i * 82, 620, item[1], i * 0.45, localT));
      }

      function drawQueue(localT) {
        drawChrome(210, 118, 860, 470);
        text("Control Queue", 290, 220, 30, 900);
        const rows = [
          ["A-12", "Now serving", palette.teal],
          ["A-13", "Next patient", palette.cyan],
          ["B-07", "Appointment", palette.green],
          ["W-21", "Walk-in", palette.amber],
        ];
        rows.forEach((r, i) => {
          const a = ease(clamp((localT - i * 0.35) / 0.6));
          ctx.save();
          ctx.globalAlpha = a;
          roundedRect(292, 278 + i * 58, 520, 42, 8, "#ffffff", palette.line);
          roundedRect(310, 287 + i * 58, 74, 24, 12, r[2]);
          text(r[0], 326, 290 + i * 58, 15, 900, palette.ink);
          text(r[1], 410, 286 + i * 58, 18, 800, palette.ink);
          ctx.restore();
        });
        roundedRect(842, 282, 132, 52, 8, palette.teal);
        text("Call Next", 866, 297, 18, 900, "#ffffff");
        roundedRect(842, 350, 132, 52, 8, "#ffffff", palette.line);
        text("Skip", 890, 365, 18, 900, palette.navy);
      }

      function drawTime(localT) {
        drawChrome(220, 112, 840, 474);
        text("Time Manager", 294, 214, 30, 900);
        const slots = [
          ["09:00 - 09:30", "Open", palette.green],
          ["09:30 - 10:00", "Full", palette.cyan],
          ["10:00 - 10:30", "+15 min delay", palette.coral],
          ["10:30 - 11:00", "Available", palette.green],
        ];
        slots.forEach((s, i) => {
          const a = ease(clamp((localT - i * 0.38) / 0.7));
          ctx.save();
          ctx.globalAlpha = a;
          roundedRect(300, 280 + i * 56, 500, 40, 8, "#ffffff", palette.line);
          text(s[0], 322, 290 + i * 56, 17, 800, palette.ink);
          roundedRect(646, 288 + i * 56, 124, 24, 12, s[2]);
          text(s[1], 666, 292 + i * 56, 13, 900, palette.ink);
          ctx.restore();
        });
        const pulse = 0.5 + 0.5 * Math.sin(localT * 5);
        roundedRect(828, 296, 150, 126, 8, `rgba(255,142,114,${0.22 + pulse * 0.12})`, "#ff8e72");
        text("Auto ETA", 858, 322, 20, 900, palette.ink);
        text("10:15", 862, 362, 34, 900, palette.coral);
      }

      function drawBilling(localT) {
        drawChrome(224, 112, 832, 474);
        text("Billing", 300, 212, 30, 900);
        roundedRect(304, 278, 356, 232, 8, "#ffffff", palette.line);
        text("Consultation", 334, 306, 18, 800);
        text("Rs 500", 552, 306, 18, 900, palette.navy);
        text("Medicine", 334, 352, 18, 800);
        text("Rs 350", 552, 352, 18, 900, palette.navy);
        text("Lab note", 334, 398, 18, 800);
        text("Rs 250", 552, 398, 18, 900, palette.navy);
        ctx.strokeStyle = palette.line;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(334, 446);
        ctx.lineTo(622, 446);
        ctx.stroke();
        text("Total", 334, 462, 22, 900);
        text("Rs 1,100", 520, 462, 22, 900, palette.teal);
        const a = ease(clamp((localT - 1.3) / 0.8));
        ctx.save();
        ctx.globalAlpha = a;
        roundedRect(714, 292, 226, 150, 8, "#f3fffb", palette.teal);
        text("Paid", 782, 322, 40, 900, palette.teal);
        text("Patient record updated", 744, 386, 17, 800, palette.muted);
        ctx.restore();
      }

      function drawReminders(localT) {
        drawPhone(450, 102, 380, 520);
        if (logo.complete) ctx.drawImage(logo, 494, 154, 34, 34);
        text("Krama", 538, 156, 24, 900);
        const cards = [
          ["Tomorrow 10:30 AM", "Appointment reminder", palette.cyan],
          ["After 7 days", "Revisit follow-up", palette.green],
          ["Missed visit", "Reschedule in one tap", palette.rose],
        ];
        cards.forEach((c, i) => {
          const a = ease(clamp((localT - i * 0.55) / 0.75));
          ctx.save();
          ctx.globalAlpha = a;
          roundedRect(488, 230 + i * 86, 304, 62, 8, c[2]);
          text(c[0], 512, 242 + i * 86, 16, 900, palette.ink);
          text(c[1], 512, 266 + i * 86, 18, 800, palette.ink);
          ctx.restore();
        });
      }

      function drawFinal(localT) {
        const a = ease(clamp(localT / 1.2));
        ctx.save();
        ctx.globalAlpha = a;
        if (logo.complete) ctx.drawImage(logo, 565, 118, 150, 150);
        text("Krama", 640, 294, 64, 900, palette.ink, "center");
        text("Digital queue. Scheduling. Delay management. Billing. Revisits.", 640, 388, 28, 800, palette.navy, "center");
        roundedRect(444, 472, 392, 58, 8, palette.teal);
        text("Less waiting. Better clinic flow.", 640, 488, 22, 900, "#ffffff", "center");
        ctx.restore();
      }

      function drawScene(scene, localT, globalT) {
        const enter = ease(clamp(localT / 0.8));
        ctx.save();
        ctx.globalAlpha = enter;
        text(scene.title, 76, 62, scene.title === "Krama" ? 58 : 42, 900);
        text(scene.sub, 78, scene.title === "Krama" ? 138 : 118, 24, 700, palette.muted);
        ctx.restore();

        if (scene.title === "Krama") {
          if (logo.complete) ctx.drawImage(logo, 470, 220, 180, 180);
          text("Krama", 710, 256, 70, 900, palette.ink);
          text("A clinic workflow video in under one minute", 716, 346, 23, 800, palette.navy);
          return;
        }
        if (scene.title === "The clinic problem") drawProblems(localT);
        if (scene.title === "Control Queue") drawQueue(localT);
        if (scene.title === "Time Manager") drawTime(localT);
        if (scene.title === "Billing Section") drawBilling(localT);
        if (scene.title === "Reminders & Revisits") drawReminders(localT);
        if (scene.title === "One flow. Less waiting.") drawFinal(localT);
      }

      function background(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        g.addColorStop(0, "#f8fffd");
        g.addColorStop(0.5, "#eefaf7");
        g.addColorStop(1, "#fff7ee");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 5; i += 1) {
          const x = 120 + i * 250 + Math.sin(t * 0.7 + i) * 16;
          const y = 620 + Math.cos(t * 0.8 + i) * 10;
          roundedRect(x, y, 128, 12, 8, ["#76d9ee", "#21c7b5", "#ff8e72", "#ffc44f", "#f46fa5"][i]);
        }
      }

      function render(now) {
        const elapsed = ((now - start) / 1000) % duration;
        background(elapsed);
        const scene = scenes.find((item) => elapsed >= item.start && elapsed < item.end) || scenes[scenes.length - 1];
        drawScene(scene, elapsed - scene.start, elapsed);
        const progress = elapsed / duration;
        roundedRect(78, 666, 1124, 10, 8, "rgba(20,49,45,0.12)");
        roundedRect(78, 666, 1124 * progress, 10, 8, palette.teal);
        requestAnimationFrame(render);
      }

      function restart() {
        start = performance.now();
      }

      async function exportWebm() {
        if (recording) return;
        recording = true;
        restart();
        statusEl.textContent = "Recording WebM. Keep this tab open for 54 seconds...";
        const stream = canvas.captureStream(30);
        const chunks = [];
        const recorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
        recorder.ondataavailable = (event) => {
          if (event.data.size) chunks.push(event.data);
        };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "krama-pitch-video.webm";
          link.textContent = "Download krama-pitch-video.webm";
          statusEl.textContent = "Export ready: ";
          statusEl.appendChild(link);
          link.click();
          recording = false;
        };
        recorder.start();
        setTimeout(() => recorder.stop(), duration * 1000);
      }

      document.getElementById("restart").addEventListener("click", restart);
      document.getElementById("record").addEventListener("click", exportWebm);
      logo.onload = () => restart();
      requestAnimationFrame(render);
      window.kramaPitch = { exportWebm, restart, duration };
    </script>
  </body>
</html>
